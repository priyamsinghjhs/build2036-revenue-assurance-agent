name: Agent evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt
      - name: Run DeepEval suite
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_AI_API_TOKEN" ]; then
            echo "Skipping DeepEval — repository secrets CF_ACCOUNT_ID and CF_AI_API_TOKEN are not set."
            echo "A maintainer can add them in the repo settings. This job is a no-op without them."
            exit 0
          fi
          python evals/deepeval_suite.py
